<svg xmlns="http://www.w3.org/2000/svg" width="760" height="476" viewBox="0 0 760 476" role="img" aria-labelledby="t d">
<title id="t">How mechanet init reads adsorbates that a slab file carries</title>
<desc id="d">Three columns. An OOH on a metal and a Cl on a metal are each read as the state of a site: the outer atoms of the OOH and the Cl are taken out of the slab the project keeps, and the campaign is built on the surface as given, with the atoms where the file has them. An O2 lying across two metals holds on through two atoms, cannot be the state of one site, and stays in the slab.</desc>
