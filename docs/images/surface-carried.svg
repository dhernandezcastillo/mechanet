<text x="640.0" y="32.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,'DejaVu Sans',sans-serif" font-size="12" fill="#5f5e59" text-anchor="middle">O₂ across two metals</text>
