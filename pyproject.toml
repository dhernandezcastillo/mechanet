[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "mechanet"
version = "0.1.1"
description = "Reaction networks for electrocatalysis on surfaces: site detection, starting structures, staged VASP runs on any SLURM cluster, pathway discovery and CHE thermodynamics (OER, CER, surface Pourbaix)."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "David Hernández Castillo"}]
keywords = ["electrocatalysis", "OER", "CER", "DFT", "VASP", "SLURM", "computational hydrogen electrode", "Pourbaix", "reaction networks"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "numpy>=1.22",
    "ase>=3.23",
    "spglib>=2.5",
    "pyyaml>=6.0",
    "networkx>=3.1",
]

[project.optional-dependencies]
plots = ["matplotlib>=3.5"]
test = ["pytest>=7", "matplotlib>=3.5"]

[project.urls]
Homepage = "https://github.com/dhernandezcastillo/mechanet"
Documentation = "https://github.com/dhernandezcastillo/mechanet/tree/main/docs"
Changelog = "https://github.com/dhernandezcastillo/mechanet/blob/main/CHANGELOG.md"
Issues = "https://github.com/dhernandezcastillo/mechanet/issues"

[project.scripts]
mechanet = "mechanet.cli:main"

# Built-in plugins are registered through the same entry-point groups that external
# packages use; see docs/plugins.md.
[project.entry-points."mechanet.reactions"]
oer = "mechanet.reactions:OER"
cer = "mechanet.reactions:CER"

[project.entry-points."mechanet.families"]
oer = "mechanet.families.oer:register"
cer = "mechanet.families.cer:register"
coverage = "mechanet.families.coverage:register"

[project.entry-points."mechanet.adsorbates"]
builtin = "mechanet.adsorbates:register"

[project.entry-points."mechanet.commands"]
pourbaix = "mechanet.pourbaix:register_command"
pathways = "mechanet.pathways:register_command"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mechanet = ["data/*.json", "data/*.yaml", "data/presets/*/*", "data/slabs/*.vasp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "B"]
ignore = ["B905"]   # zip() without strict=: lengths are checked where it matters

[tool.ruff.lint.per-file-ignores]
# embedded synthetic VASP / sbatch programs are kept verbatim
"tests/support.py" = ["E501"]
"tests/test_execution_throughput.py" = ["E501"]
